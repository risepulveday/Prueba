spring.application.name=notificacion
server.port=8084

# --- Springdoc / Swagger Configuration ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Access via: http://localhost:8084/doc/swagger-ui.html
springdoc.swagger-ui.path=/doc/swagger-ui.html

# --- MySQL Database Connection ---
# Replace 'tu_base_datos_notificaciones' with your actual database name
spring.datasource.url=jdbc:mysql://localhost:3306/tu_base_datos_notificaciones?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

#propiedades de perfil
spring.profiles.active=dev