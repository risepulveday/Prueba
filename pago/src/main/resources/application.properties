spring.application.name=pago
server.port=8085

# --- Activar Perfil ---
spring.profiles.active=dev

# --- Springdoc / Swagger Configuration ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# --- Configuración por Defecto (Producción / Local Base) ---
spring.datasource.url=jdbc:mysql://localhost:3306/mi_base_datos_pago?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true