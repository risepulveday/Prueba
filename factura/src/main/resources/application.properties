spring.application.name=factura
server.port=8083

# --- Springdoc / Swagger Configuration ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Access via: http://localhost:8083/doc/swagger-ui.html
springdoc.swagger-ui.path=/doc/swagger-ui.html

# --- MySQL Database Connection ---
# Replace 'mi_base_datos_factura' with your actual database name
spring.datasource.url=jdbc:mysql://localhost:3306/mi_base_datos_factura?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

#propiedades de perfil
spring.profiles.active=dev